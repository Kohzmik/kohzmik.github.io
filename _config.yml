remote_theme: "mmistakes/minimal-mistakes@4.28.1"


minimal_mistakes_skin: "dark"


locale: "en"
title: "Rabbit Holes & Root Shells"
title_separator: "-"
subtitle: "Offensive Security & Other Rabbit Holes"

description: >-
  Writeups and thoughts on penetration testing, CTFs,
  certifications, offensive security, and whatever technical
  rabbit hole I'm exploring next.

url: "https://kohzmik.github.io"
baseurl: ""

repository: "Kohzmik/kohzmik.github.io"


author:
  name: "Daniel Tshabalala"
  bio: "IT student, offensive security enthusiast, and CTF creator."
  location: "South Africa"

  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Kohzmik"

    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/daniel-tshabalala-aa0a1a223"


search: true
breadcrumbs: true

permalink: /:categories/:title/

paginate: 5
paginate_path: /page:num/

include:
  - _pages


plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/


defaults:

  # Blog posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
      show_date: true
      toc: true
      toc_sticky: true

  # Normal pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
